<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta Socio</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="altasocio.js" defer></script>
</head>
<body>

    <section class="card section-alta">
        <h2>Alta de Nuevo Socio</h2>
        
        <div id="alta-mensaje-exito" class="alert alert-success hidden"></div>

        <form id="form-alta" >
          <div class="form-row">
            <div class="form-group">
              <label for="alta-nombre">Nombre y Apellidos</label>
              <input type="text" id="alta-nombre" placeholder="Ej. María José Ruiz">
              <span class="error-text" id="err-nombre"></span>
            </div>
            <div class="form-group">
              <label for="alta-dni">DNI</label>
              <input type="text" id="alta-dni" placeholder="12345678Z">
              <span class="error-text" id="err-dni"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="alta-email">Email</label>
              <input type="email" id="alta-email" placeholder="ana@correo.es">
              <span class="error-text" id="err-email"></span>
            </div>
            <div class="form-group">
              <label for="alta-telefono">Teléfono</label>
              <input type="tel" id="alta-telefono" placeholder="612 345 678">
              <span class="error-text" id="err-telefono"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="alta-nacimiento">Fecha de nacimiento</label>
              <input type="text" id="alta-nacimiento" placeholder="dd/mm/aaaa">
              <span class="error-text" id="err-nacimiento"></span>
            </div>
            <div class="form-group">
              <label for="alta-cuota">Cuota (€/mes)</label>
              <input type="number" id="alta-cuota" min="0" step="0.01" value="35">
              <span class="error-text" id="err-cuota"></span>
            </div>
          </div>

          <div class="form-group">
            <label>Actividades (Marca al menos una)</label>
            <div class="checkbox-group" id="actividades">
              <label class="checkbox-label"><input type="checkbox" name="actividades" value="natación"> Natación</label>
              <label class="checkbox-label"><input type="checkbox" name="actividades" value="yoga"> Yoga</label>
              <label class="checkbox-label"><input type="checkbox" name="actividades" value="pádel"> Pádel</label>
              <label class="checkbox-label"><input type="checkbox" name="actividades" value="musculación"> Musculación</label>
              <label class="checkbox-label"><input type="checkbox" name="actividades" value="spinning"> Spinning</label>
              <label class="checkbox-label"><input type="checkbox" name="actividades" value="pilates"> Pilates</label>
            </div>
            <span class="error-text" id="err-actividades"></span>
          </div>

          <button type="submit" class="btnDefecto">Dar de Alta Socio</button>
        </form>
      </section>
    
</body>
</html>
