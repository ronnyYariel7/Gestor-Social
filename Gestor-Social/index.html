<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Socios - Club Deportivo</title>
  <link rel="stylesheet" href="css/styles.css">
  <script  src="app.js" defer></script>
</head>
<body>

  <!-- 3.1 Cabecera -->
  <header class="app-header">
    <div class="header-container">
      <h1>Club Deportivo <span>Gestor de Socios</span></h1>
      <h1 id="fechaActual"></h1>
      <div class="datetime-display">
        <span id="current-date" class="date-text">Hora Actual</span>
        <span id="tiempoActual" class="time-text">00:00:00</span>
      </div>
    </div>
  </header>

  <main class="main-container">

    <!-- 3.2 Listado de socios -->
    <section class="card section-listado" id="seccion-listado">
      <div class="section-header">
        <h2>Listado de Socios</h2>
        <button id="btnFullscreen" class="btn btn-outline" title="Pantalla completa">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
          <span>Pantalla completa</span>
        </button>
      </div>

      <!-- Buscador, Filtro y Ordenación -->
      <div class="toolbar">
        <div class="form-group search-group">
          <label for="input-search">Buscar socio</label>
          <input type="text" id="inpBuscar" placeholder="Nombre, apellidos o email...">
        </div>

        <div class="form-group">
          <label for="selec-Actividad">Actividad</label>
          <select id="selecActividad">
            <option value="todas">Todas las actividades</option>
            <option value="natación">Natación</option>
            <option value="yoga">Yoga</option>
            <option value="pádel">Pádel</option>
            <option value="musculación">Musculación</option>
            <option value="spinning">Spinning</option>
            <option value="pilates">Pilates</option>
          </select>
        </div>

        <div class="form-group">
          <label for="select-orden">Ordenar por</label>
          <select id="selecOrdenar">
            <option value="nombre">Nombre</option>
            <option value="apellidos">Apellidos</option>
            <option value="jovenes">Más jóvenes primero</option>
            <option value="antiguos">Más antiguos primero</option>
          </select>
        </div>
      </div>

      <!-- Tabla de socios -->
      <div class="table-responsive">
        <table class="socios-table" >
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Actividades</th>
              <th>Edad</th>
              <th>Cuota</th>
            </tr>
          </thead>
          <tbody id="sociosTabla">
            <!-- Filas dinámicas mediante JS -->
          </tbody>
        </table>
        <div id="no-results" class="no-results hidden">
          <p>No hay socios que coincidan</p>
        </div>
      </div>
    </section>

    <div class="ventanasOpciones" id="ventanasOpciones">
      
     </div>
    </section>

  </main>

</body>
</html>
